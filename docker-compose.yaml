services:
  mariadb:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: creeping_crawler
      MARIADB_USER: creeping_crawler
      MARIADB_PASSWORD: creeping_crawler
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ollama-data:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh
    healthcheck:
      # Considera healthy solo quando il modello è già stato scaricato
      # (al primo boot il pull può richiedere alcuni minuti).
      test: ["CMD-SHELL", "ollama list | grep -q llama3.2:3b"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8003:8003"
    environment:
      DB_HOST: mariadb
      DB_NAME: creeping_crawler
      DB_USER: creeping_crawler
      DB_PASSWORD: creeping_crawler
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    depends_on:
      mariadb:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8004:8004"
    environment:
      BACKEND_URL: http://backend:8003
    depends_on:
      - backend

volumes:
  mariadb-data:
  ollama-data:
